name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Verify migrations
        run: pnpm verify:migrations
      - name: Check architecture boundaries
        run: npx --yes fallow@3.31.0 dead-code --boundary-violations --fail-on-issues --quiet
      - name: Test
        run: pnpm test -- --run
      - name: Build
        run: pnpm build
      - name: Validate Docker Compose
        run: |
          touch .env
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.observability.yml config --quiet
          docker compose -f docker-compose.stack.yml config --quiet

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: soonwhy
          POSTGRES_PASSWORD: soonwhy
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U soonwhy -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://soonwhy:soonwhy@localhost:5433/soonwhy_test
      REDIS_TEST_URL: redis://localhost:6380
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm build:deps
      - name: Database integration tests
        run: pnpm --filter @soonwhy/backend test:integration
      - name: Ingest integration tests
        run: pnpm --filter @soonwhy/ingest test:integration

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/ui
      - name: Browser smoke tests
        run: pnpm test:e2e
        working-directory: apps/ui
      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/ui/test-results
          retention-days: 7

  build-image:
    needs: checks
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/dev","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO_LC}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${REPO_LC##*/}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch

      - name: Build and push the stack image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stack
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged GHCR manifests
        uses: actions/delete-package-versions@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

  # Merged to dev or main → image pushed → tell dokploy to re-pull the
  # branch tag and redeploy. One compose app serves api + ingest + telemetry; set
  # DOKPLOY_WEBHOOK_URL as a repo secret (Dokploy → app → Webhooks).
  # If the secret is unset the job fails — the redeploy is never silently skipped.
  deploy:
    needs: build-image
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/dev","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      DOKPLOY_BRANCH: ${{ vars.DOKPLOY_BRANCH || github.ref_name }}
    steps:
      - name: Trigger dokploy redeploy
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::Repo secret DOKPLOY_WEBHOOK_URL is not set; refusing to skip the dokploy redeploy"
            exit 1
          fi
          out=$(curl -sS -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\":\"refs/heads/${DOKPLOY_BRANCH}\"}" \
            -w $'\n%{http_code}')
          code=${out##*$'\n'}
          body=${out%$'\n'*}
          echo "dokploy answered $code: $body"
          if [ "$code" -ge 400 ] || grep -qiE 'not match|error|fail|invalid|not found' <<<"$body"; then
            echo "::error::Dokploy did not start a deploy (branch sent: ${DOKPLOY_BRANCH}). Set the repo variable DOKPLOY_BRANCH to the branch configured on the Dokploy app."
            exit 1
          fi

      - name: Wait for the new deploy to be healthy
        env:
          SOONWHY_API_URL: ${{ vars.SOONWHY_API_URL }}
        run: |
          if [ -z "$SOONWHY_API_URL" ]; then
            echo "::warning::Repo variable SOONWHY_API_URL is not set, so the deploy was not verified. Set it to the public API origin, for example https://api-soonwhy.example.com"
            exit 0
          fi
          url="${SOONWHY_API_URL%/}/api/v1/health/ready"
          sleep 45
          ok=0
          for attempt in $(seq 1 40); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 10 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
              echo "attempt $attempt: ready ($ok/3)"
              if [ "$ok" -ge 3 ]; then
                echo "Deploy is healthy: $(cat /tmp/ready.json)"
                exit 0
              fi
            else
              ok=0
              echo "attempt $attempt: $code"
            fi
            sleep 15
          done
          echo "::error::$url did not report ready after the deploy. Last body: $(cat /tmp/ready.json 2>/dev/null)"
          exit 1
