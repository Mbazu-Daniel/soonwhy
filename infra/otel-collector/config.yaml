receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: 10s
    root_path: /hostfs
    scrapers:
      cpu:
      disk:
      filesystem:
      memory:
      network:
      load:
      process:
        process_names: ["node", "postgres", "redis", "nats"]
  system:
    collection_interval: 10s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/quickwit:
    endpoint: quickwit:7280
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/quickwit]
    metrics:
      receivers: [otlp, hostmetrics, system]
      processors: [memory_limiter, batch]
      exporters: [otlp/quickwit]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/quickwit]
