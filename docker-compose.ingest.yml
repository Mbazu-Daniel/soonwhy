# Soonwhy ingest + its telemetry dependencies (NATS, Quickwit).
# Other half of the backend + telemetry pair; the app itself is docker-compose.api.yml.
# This is our exception to the Dockerfile-app rule — we can live with compose here.
# Postgres and Redis are NOT in this stack — point DATABASE_URL and REDIS_URL at
# your own instances in the env form (.env next to this file on the server).
# api and ingest are deployed as two separate apps. Only ingest joins the
# external network `soonwhy-backend`, so api can reach it as http://ingest:3002;
# NATS and Quickwit stay on this project's own bridge. Create the shared
# network once on the host: docker network create soonwhy-backend
# Only this service gets a public domain (routed at the proxy); no host
# ports are published. NATS and Quickwit stay internal.
# Note: the telemetry bridge must NOT be marked internal — Quickwit needs
# outbound access to R2/S3.

services:
  nats:
    image: nats:2.11-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    env_file:
      - .env
    volumes:
      - nats-data:/data
    networks:
      - telemetry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  quickwit:
    image: quickwit/quickwit:0.9.0
    command: ["run"]
    env_file:
      - .env
    environment:
      QW_LISTEN_ADDRESS: 0.0.0.0
      QW_REST_LISTEN_PORT: 7280
      QW_CLUSTER_ID: ${QUICKWIT_CLUSTER_ID:-soonwhy}
      QW_DATA_DIR: /quickwit/qwdata
      QW_METASTORE_URI: s3://${R2_BUCKET}/${R2_PREFIX:-quickwit}/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://${R2_BUCKET}/${R2_PREFIX:-quickwit}/indexes
      QW_S3_ENDPOINT: ${R2_ENDPOINT}
      QW_S3_REGION: ${R2_REGION:-auto}
      QW_S3_FORCE_PATH_STYLE_ACCESS: ${R2_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      AWS_REGION: ${R2_REGION:-auto}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    volumes:
      - quickwit-data:/quickwit/qwdata
      - ./infra/telemetry/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
    networks:
      - telemetry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7280/health/livez"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ingest:
    image: ghcr.io/mbazu-daniel/soonwhy-ingest:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: 3002
    networks:
      - telemetry
      - soonwhy-backend
    depends_on:
      nats: { condition: service_healthy }
      quickwit: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  nats-data:
  quickwit-data:

networks:
  telemetry:
  soonwhy-backend:
    external: true
    name: soonwhy-backend
