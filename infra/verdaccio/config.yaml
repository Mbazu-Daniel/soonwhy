storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/conf/htpasswd

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  'soonwhy-*':
    access: $all
    publish: $all
    proxy: npmjs

  '@soonwhy/*':
    access: $all
    publish: $all
    proxy: npmjs

  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs

web:
  enable: true
  title: Soonwhy Local Registry
  pkgManagers:
    - npm
    - pnpm
