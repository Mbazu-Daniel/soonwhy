# Soonwhy API service (production image pulled from GHCR on redeploy).
# Half of the backend + telemetry pair; the other half is docker-compose.ingest.yml.
# This is our exception to the Dockerfile-app rule — we can live with compose here.
# Postgres and Redis are NOT in this stack — point DATABASE_URL and REDIS_URL at
# your own instances in the env form (.env next to this file on the server).
# api and ingest are deployed as two separate apps and share the external
# network `soonwhy-backend` so api can reach INGEST_URL=http://ingest:3002 by
# service name. Create it once on the host: docker network create soonwhy-backend
# Only this service gets a public domain (routed at the proxy); no host
# ports are published.

services:
  api:
    image: ghcr.io/mbazu-daniel/soonwhy-api:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: 3001
      INGEST_URL: http://ingest:3002
    networks:
      - soonwhy-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  soonwhy-backend:
    external: true
    name: soonwhy-backend
