name: Publish

on:
  push:
    branches: [dev]
    paths:
      - 'apps/api/**'
      - 'packages/ingest/**'
      - 'packages/shared/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/api/**'
      - 'packages/ingest/**'
      - 'packages/shared/**'
      - 'packages/tsconfig/**'
      - '.github/workflows/publish.yml'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image-suffix: api
          - service: ingest
            dockerfile: packages/ingest/Dockerfile
            image-suffix: ingest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO_LC}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${REPO_LC##*/}-${{ matrix.image-suffix }}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}-${{ matrix.image-suffix }}
          tags: |
            type=ref,event=branch

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Prune untagged GHCR manifests
        uses: actions/delete-package-versions@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

  # Merged to dev → images pushed → tell dokploy to re-pull :dev and
  # redeploy. Each service is its own dokploy application with its own
  # webhook: set DOKPLOY_WEBHOOK_URL_API and DOKPLOY_WEBHOOK_URL_INGEST
  # as repo secrets (Dokploy → application → Webhooks). If either secret
  # is unset the job fails — the redeploy is never silently skipped.
  deploy:
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingest]
    env:
      DOKPLOY_WEBHOOK_URL_API: ${{ secrets.DOKPLOY_WEBHOOK_URL_API }}
      DOKPLOY_WEBHOOK_URL_INGEST: ${{ secrets.DOKPLOY_WEBHOOK_URL_INGEST }}
    steps:
      - name: Trigger dokploy redeploy (${{ matrix.service }})
        run: |
          case "${{ matrix.service }}" in
            api)    url="$DOKPLOY_WEBHOOK_URL_API";    secret="DOKPLOY_WEBHOOK_URL_API" ;;
            ingest) url="$DOKPLOY_WEBHOOK_URL_INGEST"; secret="DOKPLOY_WEBHOOK_URL_INGEST" ;;
          esac
          if [ -z "$url" ]; then
            echo "::error::Repo secret $secret is not set; refusing to skip the dokploy redeploy"
            exit 1
          fi
          curl -fsS -X POST "$url"
