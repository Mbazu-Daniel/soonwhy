services:
  postgres:
    image: postgres:18-alpine
    container_name: soonwhy-postgres
    environment:
      POSTGRES_DB: soonwhy
      POSTGRES_USER: soonwhy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soonwhy_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soonwhy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soonwhy-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    container_name: soonwhy-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js"]
    volumes:
      - nats_data:/data



  quickwit:
    image: quickwit/quickwit:0.9.3
    container_name: soonwhy-quickwit
    ports:
      - "7280:7280"
    volumes:
      - quickwit_data:/quickwit/qwdata
    command: ["run"]
    healthcheck:
      test: ["CMD", "quickwit", "index", "list", "--endpoint", "http://127.0.0.1:7280"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  quickwit_data:

networks:
  soonwhy-network:
    driver: bridge
