# Soonwhy production stack: API + ingest + telemetry (NATS, Quickwit), one service.
# api and ingest are the only services that get public domains (mapped per
# service in the Dokploy Domains tab):
#   api-soonwhy.oktopals.com    → service api     on 3001
#   ingest-soonwhy.oktopals.com → service ingest  on 3002
# nats and quickwit stay internal on the project network — no host ports, no domains.
# Postgres and Redis are NOT in this stack; point DATABASE_URL and REDIS_URL at
# your own instances in the env form (.env next to this file on the server).
# Volume names are pinned to the previous app's volumes so existing NATS and
# Quickwit data survives the move.

services:
  nats:
    image: nats:2.11-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    env_file:
      - .env
    volumes:
      - nats-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  quickwit:
    image: quickwit/quickwit:0.9.0
    command: ["run"]
    env_file:
      - .env
    environment:
      QW_LISTEN_ADDRESS: 0.0.0.0
      QW_REST_LISTEN_PORT: 7280
      QW_CLUSTER_ID: ${QUICKWIT_CLUSTER_ID:-soonwhy}
      QW_DATA_DIR: /quickwit/qwdata
      QW_METASTORE_URI: s3://${R2_BUCKET}/${R2_PREFIX:-quickwit}/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://${R2_BUCKET}/${R2_PREFIX:-quickwit}/indexes
      QW_S3_ENDPOINT: ${R2_ENDPOINT}
      QW_S3_REGION: ${R2_REGION:-auto}
      QW_S3_FORCE_PATH_STYLE_ACCESS: ${R2_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      AWS_REGION: ${R2_REGION:-auto}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    volumes:
      - quickwit-data:/quickwit/qwdata
      - ./infra/telemetry/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: >-
        bash -c "exec 3<>/dev/tcp/127.0.0.1/7280 &&
        printf 'GET /health/livez HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3 &&
        head -1 <&3 | grep -q 200"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ingest:
    image: ghcr.io/mbazu-daniel/soonwhy-ingest:${IMAGE_TAG:-dev}
    pull_policy: always
    env_file:
      - .env
    environment:
      PORT: 3002
    depends_on:
      nats: { condition: service_healthy }
      quickwit: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ghcr.io/mbazu-daniel/soonwhy-api:${IMAGE_TAG:-dev}
    pull_policy: always
    env_file:
      - .env
    environment:
      PORT: 3001
      INGEST_URL: http://ingest:3002
      # Self-observability is off by default in code (api ignores
      # OTEL_EXPORTER_OTLP_* unless SELF_OBSERVABILITY_ENABLED=true).
    depends_on:
      ingest: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  nats-data:
    name: soonwhy-ingests-wtchlp_nats-data
  quickwit-data:
    name: soonwhy-ingests-wtchlp_quickwit-data
