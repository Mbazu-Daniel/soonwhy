services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soonwhy
      POSTGRES_PASSWORD: soonwhy
      POSTGRES_DB: soonwhy
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soonwhy -d soonwhy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soonwhy
      MINIO_ROOT_PASSWORD: soonwhy-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      mc alias set local http://minio:9000 soonwhy soonwhy-secret
      mc mb --ignore-existing local/soonwhy-quickwit

  quickwit:
    image: quickwit/quickwit:0.9.0
    depends_on:
      minio-init: {condition: service_completed_successfully}
    command: run
    environment:
      AWS_ACCESS_KEY_ID: soonwhy
      AWS_SECRET_ACCESS_KEY: soonwhy-secret
      QW_S3_ENDPOINT: http://minio:9000
      QW_METASTORE_URI: s3://soonwhy-quickwit/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://soonwhy-quickwit/indexes
    ports: ["7280:7280"]
    volumes:
      - quickwit-data:/quickwit/qwdata
      - ./infra/quickwit/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7280/api/v1/version"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgres://soonwhy:soonwhy@postgres:5432/soonwhy
      REDIS_URL: redis://redis:6379
      QUICKWIT_URL: http://quickwit:7280
      NATS_URL: nats://nats:4222
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      quickwit: {condition: service_healthy}
      nats: {condition: service_healthy}
    ports: ["3001:3001"]
    command: ["sh", "-c", "pnpm --filter @soonwhy/backend db:push && pnpm --filter @soonwhy/backend start:prod"]

  ingest:
    build: {context: ., target: ingest}
    environment:
      NATS_URL: nats://nats:4222
      QUICKWIT_URL: http://quickwit:7280
      REDIS_URL: redis://redis:6379
      PORT: 3002
    depends_on:
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}
      quickwit: {condition: service_healthy}
    ports: ["3002:3002"]

  cron:
    build: {context: ., target: cron}
    environment:
      DATABASE_URL: postgres://soonwhy:soonwhy@postgres:5432/soonwhy
      REDIS_URL: redis://redis:6379
      QUICKWIT_URL: http://quickwit:7280
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      quickwit: {condition: service_healthy}
      nats: {condition: service_healthy}

  ui:
    build: {context: ., target: ui}
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    depends_on:
      api: {condition: service_started}
    ports: ["3000:3000"]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  quickwit-data:
