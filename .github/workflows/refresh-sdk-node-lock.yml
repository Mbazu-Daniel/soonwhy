name: Refresh SDK Node lockfile

on:
  push:
    branches: ["feat/sdk-node"]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.head_commit.message != 'chore(sdk-node): refresh lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore(sdk-node): refresh lockfile"
          git push
