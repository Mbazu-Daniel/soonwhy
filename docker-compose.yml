services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soonwhy
      POSTGRES_PASSWORD: soonwhy
      POSTGRES_DB: soonwhy
    # Host Postgres already listens on 5432. The container is still :5432 on the compose network.
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soonwhy -d soonwhy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # Host Redis already listens on 6379. The container is still :6379 on the compose network.
    ports: ["6380:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soonwhy
      MINIO_ROOT_PASSWORD: soonwhy-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MC_HOST_local: http://soonwhy:soonwhy-secret@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/soonwhy-quickwit"]
    restart: "on-failure"

  quickwit:
    image: quickwit/quickwit:0.9.0
    depends_on:
      minio-init: {condition: service_completed_successfully}
    command: run
    environment:
      AWS_ACCESS_KEY_ID: soonwhy
      AWS_SECRET_ACCESS_KEY: soonwhy-secret
      QW_S3_ENDPOINT: http://minio:9000
      QW_S3_FORCE_PATH_STYLE_ACCESS: "true"
      QW_METASTORE_URI: s3://soonwhy-quickwit/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://soonwhy-quickwit/indexes
    ports: ["7280:7280"]
    volumes:
      - quickwit-data:/quickwit/qwdata
      - ./infra/quickwit/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
    healthcheck:
      test: ["CMD", "quickwit", "index", "list", "--endpoint", "http://127.0.0.1:7280"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgres://soonwhy:soonwhy@postgres:5432/soonwhy
      REDIS_URL: redis://redis:6379
      QUICKWIT_URL: http://quickwit:7280
      NATS_URL: nats://nats:4222
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: replace-with-a-long-random-secret
      PORT: 3001
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      quickwit: {condition: service_healthy}
      nats: {condition: service_healthy}
    ports: ["3001:3001"]
    command: ["sh", "-c", "pnpm --filter @soonwhy/backend exec drizzle-kit push --force && pnpm --filter @soonwhy/backend start:prod"]

  ingest:
    build: {context: ., target: ingest}
    environment:
      NATS_URL: nats://nats:4222
      QUICKWIT_URL: http://quickwit:7280
      REDIS_URL: redis://redis:6379
      PORT: 3002
    depends_on:
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}
      quickwit: {condition: service_healthy}
    ports: ["3002:3002"]

  cron:
    build: {context: ., target: cron}
    environment:
      DATABASE_URL: postgres://soonwhy:soonwhy@postgres:5432/soonwhy
      REDIS_URL: redis://redis:6379
      QUICKWIT_URL: http://quickwit:7280
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      quickwit: {condition: service_healthy}
      nats: {condition: service_healthy}

  ui:
    build:
      context: .
      target: ui
      args:
        # Browser calls the published API port. The /api/v1 prefix is added in the client.
        VITE_API_URL: http://localhost:3001
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      api: {condition: service_started}
    ports: ["3000:3000"]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  quickwit-data:
