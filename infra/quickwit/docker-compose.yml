services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soonwhy
      MINIO_ROOT_PASSWORD: soonwhy-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://soonwhy:soonwhy-secret@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/soonwhy-quickwit"]
    restart: "on-failure"

  quickwit:
    image: quickwit/quickwit:0.9.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command: run
    environment:
      AWS_ACCESS_KEY_ID: soonwhy
      AWS_SECRET_ACCESS_KEY: soonwhy-secret
      QW_S3_ENDPOINT: http://minio:9000
      QW_S3_FORCE_PATH_STYLE_ACCESS: "true"
      QW_METASTORE_URI: s3://soonwhy-quickwit/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://soonwhy-quickwit/indexes
    ports:
      - "7280:7280"
    volumes:
      - quickwit-data:/quickwit/qwdata
      - ./quickwit.yaml:/quickwit/config/quickwit.yaml:ro

volumes:
  minio-data:
  quickwit-data:
