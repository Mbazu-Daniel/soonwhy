name: RCA evaluation

on:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVAL_DIR: apps/api/eval
  SMOKE_BASELINE: apps/api/eval/baseline/synthetic-smoke.json
  FULL_BASELINE: apps/api/eval/baseline/synthetic-tuning.json

jobs:
  eval-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Evaluation tooling tests
        run: pnpm --filter @soonwhy/backend eval:synthetic:unit
      - name: Smoke subset
        run: |
          pids=()
          for topology in six chain12 mesh; do
            EVAL_TOPOLOGY=$topology EVAL_SPLIT=tuning EVAL_MAX_REPS=3 EVAL_CONTROL_REPS=7 EVAL_TAG=-smoke \
              pnpm --filter @soonwhy/backend eval:synthetic &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit $status
      - name: Smoke gate
        run: |
          pnpm --filter @soonwhy/backend eval:synthetic:gate tuning-smoke "$GITHUB_WORKSPACE/$SMOKE_BASELINE" | tee smoke-gate.md
          cat smoke-gate.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Does this change touch root-cause ranking or the evaluation?
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -E '^apps/api/(src/modules/v1/detection/detections/root-cause/|eval/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Full evaluation on the tuning split
        if: steps.touched.outputs.full == 'true'
        run: |
          pids=()
          for topology in six chain12 mesh; do
            EVAL_TOPOLOGY=$topology EVAL_SPLIT=tuning pnpm --filter @soonwhy/backend eval:synthetic &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit $status
      - name: Full gate and report against the committed baseline
        if: steps.touched.outputs.full == 'true'
        run: |
          pnpm --filter @soonwhy/backend eval:synthetic:report tuning > /dev/null
          cat apps/api/eval/results/synthetic/report-tuning.md >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @soonwhy/backend eval:synthetic:gate tuning "$GITHUB_WORKSPACE/$FULL_BASELINE" | tee full-gate.md
          cat full-gate.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full synthetic suite, tuning and locked splits
        run: |
          pids=()
          for split in tuning locked; do
            for topology in six chain12 mesh; do
              EVAL_TOPOLOGY=$topology EVAL_SPLIT=$split pnpm --filter @soonwhy/backend eval:synthetic &
              pids+=($!)
            done
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit $status
      - name: Twenty-four hour soak
        run: pnpm --filter @soonwhy/backend eval:synthetic:soak
      - name: Reports
        run: |
          for split in tuning locked; do
            pnpm --filter @soonwhy/backend eval:synthetic:report "$split" > /dev/null
            cat "apps/api/eval/results/synthetic/report-$split.md" >> "$GITHUB_STEP_SUMMARY"
          done
          for file in apps/api/eval/results/synthetic/soak-*.json; do cat "$file" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done
        shell: bash
      - name: Gate on the tuning split
        id: gate
        run: pnpm --filter @soonwhy/backend eval:synthetic:gate tuning "$GITHUB_WORKSPACE/$FULL_BASELINE" | tee nightly-gate.md
        shell: bash
      - name: Open an issue when the nightly result dropped
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly RCA evaluation dropped below the baseline" \
            --body "The nightly synthetic evaluation failed its gate. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
