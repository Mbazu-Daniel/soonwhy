services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soonwhy
      POSTGRES_PASSWORD: soonwhy
      POSTGRES_DB: soonwhy
    ports:
      - "5433:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soonwhy -d soonwhy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-local-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: build

    environment:
      DATABASE_URL: postgres://soonwhy:soonwhy@postgres:5432/soonwhy
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: replace-with-a-long-random-secret
      PORT: 3001

    volumes:
      - ./apps/api/src:/app/apps/api/src

    command:
      - sh
      - -c
      - pnpm --filter @soonwhy/shared build && pnpm --filter @soonwhy/backend exec drizzle-kit push --force && pnpm --filter @soonwhy/backend dev

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "3001:3001"

  ui:
    build:
      context: .
      target: ui
      args:
        VITE_API_URL: http://localhost:3001

    environment:
      HOST: 0.0.0.0
      PORT: "3000"

    depends_on:
      api:
        condition: service_started

    ports:
      - "3000:3000"

volumes:
  postgres-local-data:
  redis-local-data: