services:
  # Self-contained backend stack for Dokploy.
  # If you already run postgres/redis elsewhere, delete those two services
  # and point DATABASE_URL / REDIS_URL at your instances.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soonwhy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soonwhy}
      POSTGRES_DB: ${POSTGRES_DB:-soonwhy}
    # Postgres 18+ expects the volume at /var/lib/postgresql (parent).
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soonwhy} -d ${POSTGRES_DB:-soonwhy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/mbazu-daniel/soonwhy-api:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: 3001
      INGEST_URL: http://ingest:3002
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # No host port needed when dokploy routes the domain at the proxy;
    # remove or keep as you prefer.
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ingest:
    image: ghcr.io/mbazu-daniel/soonwhy-ingest:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: 3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
