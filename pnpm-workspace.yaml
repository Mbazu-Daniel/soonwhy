packages:
  - 'apps/*'
  - 'packages/*'
  - 'sdk/*'
allowBuilds:
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  protobufjs: true
  '@swc/core': true
  workerd: true

peerDependencyRules:
  ignoreMissing:
    - next

