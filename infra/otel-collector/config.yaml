
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  host_metrics:
    root_path: /rootfs
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      filesystem:
      network:
      load:
      disk:

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: service.name
        value: soonwhy-host
        action: upsert

exporters:
  otlp_http/soonwhy:
    endpoint: http://host.docker.internal:8081/api/v1/telemetry

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/soonwhy]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/soonwhy]

    metrics:
      receivers: [otlp, host_metrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/soonwhy]
