# Single Dokploy stack for the Soonwhy backend + telemetry.
# Deploy from git (compose path: docker-compose.dokploy.yml), branch dev.
# Only TWO services are routed publicly: api and ingest (domains set in dokploy).
# postgres, redis, nats and quickwit stay internal.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soonwhy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soonwhy}
      POSTGRES_DB: ${POSTGRES_DB:-soonwhy}
    # Postgres 18+ expects the volume at /var/lib/postgresql (parent).
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soonwhy} -d ${POSTGRES_DB:-soonwhy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    env_file:
      - .env
    volumes:
      - nats-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  quickwit:
    image: quickwit/quickwit:0.9.0
    command: ["run"]
    env_file:
      - .env
    environment:
      QW_LISTEN_ADDRESS: 0.0.0.0
      QW_REST_LISTEN_PORT: 7280
      QW_CLUSTER_ID: ${QUICKWIT_CLUSTER_ID:-soonwhy}
      QW_DATA_DIR: /quickwit/qwdata
      QW_METASTORE_URI: s3://${R2_BUCKET}/${R2_PREFIX:-quickwit}/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://${R2_BUCKET}/${R2_PREFIX:-quickwit}/indexes
      QW_S3_ENDPOINT: ${R2_ENDPOINT}
      QW_S3_REGION: ${R2_REGION:-auto}
      QW_S3_FORCE_PATH_STYLE_ACCESS: ${R2_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      AWS_REGION: ${R2_REGION:-auto}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    volumes:
      - quickwit-data:/quickwit/qwdata
      - ./infra/dokploy/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7280/health/livez"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    image: ghcr.io/mbazu-daniel/soonwhy-api:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: 3001
      INGEST_URL: http://ingest:3002
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ingest:
    image: ghcr.io/mbazu-daniel/soonwhy-ingest:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: 3002
    depends_on:
      nats: { condition: service_healthy }
      quickwit: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  nats-data:
  quickwit-data:
